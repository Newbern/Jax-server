<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>



<form id="loginForm">
    <input
        type="email"
        id="email"
        name="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Login
    </button>
</form>

<p id="message"></p>

<script src="/web/js/login.js"></script>

</body>
</html>
