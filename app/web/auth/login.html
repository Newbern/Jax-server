
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jax - Login</title>

    <link rel="stylesheet" href="/web/auth/css/auth.css">
</head>

<body>

<main class="auth-container">

    <h1>Jax</h1>
    <p class="subtitle">Welcome back</p>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
        >


        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <p class="switch">
        Don't have an account?
        <a href="/web/auth/signup.html">Sign up</a>
    </p>

</main>

<script src="/web/auth/js/login.js"></script>

</body>
</html>
