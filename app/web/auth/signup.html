
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jax - Sign Up</title>

    <link rel="stylesheet" href="/auth-web/css/auth.css">
</head>

<body>

<main class="auth-container">

    <h1>Jax</h1>
    <p class="subtitle">Create your account</p>

    <form id="signupForm">

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
        >


        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
        >


        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Create Account
        </button>

    </form>

    <p id="message"></p>

    <p class="switch">
        Already have an account?
        <a href="/auth-web/login.html">Login</a>
    </p>

</main>

<script src="/auth-web/js/signup.js"></script>

</body>
</html>
