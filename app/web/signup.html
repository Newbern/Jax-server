<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body>

<h2>Create Account</h2>

<form id="signupForm">
    <input
        type="text"
        id="username"
        name="username"
        placeholder="Username"
        required
    >

    <br><br>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Sign Up
    </button>
</form>

<p id="message"></p>

<script src="/web/js/signup.js"></script>


</body>
</html>
